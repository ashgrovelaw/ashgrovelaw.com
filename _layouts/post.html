---
layout: default
---
<article>
  <section class="page-hero">
    <div class="wrap narrow">
      <p class="eyebrow"><a href="{{ '/insights/' | relative_url }}">Legal insights</a></p>
      <h1>{{ page.title }}</h1>
      <p class="byline">By {{ page.author }} &middot; <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    </div>
  </section>
  <div class="wrap narrow prose">
    {{ content }}
    <p class="disclaimer">This article is general information about Ohio law as of the date above. It is not legal advice for your situation. If you have a specific question, <a href="{{ '/contact/' | relative_url }}">talk to us</a>.</p>
  </div>
</article>
